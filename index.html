<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอปจดค่าไฟส่วนตัว</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js สำหรับแสดงกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 mt-4 mb-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">⚡ บันทึกมิเตอร์ค่าไฟ</h1>
        <p class="text-xs text-slate-400 text-center mb-6">รอบบิลตัดทุกวันที่ 25 ของเดือน</p>
        
        <!-- ฟอร์มกรอกข้อมูล -->
        <form id="electricForm" class="space-y-4">
            <input type="hidden" id="editId">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">วันที่จดมิเตอร์จริง</label>
                <input type="date" id="recordDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">เลขมิเตอร์ที่อ่านได้ (Unit)</label>
                <input type="number" step="any" id="meterUnit" placeholder="กำลังโหลดข้อมูลล่าสุด..." required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">ราคาค่าไฟต่อหน่วย (บาท)</label>
                <input type="number" step="any" id="unitRate" value="4.5" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex gap-2">
                <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">บันทึกข้อมูล</button>
                <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-semibold hover:bg-slate-400 transition">ยกเลิก</button>
            </div>
        </form>

        <!-- ส่วนแสดงกราฟการใช้ไฟฟ้า -->
        <div class="mt-8">
            <h2 class="text-lg font-bold text-slate-800 mb-3">📊 กราฟแสดงหน่วยที่ใช้ (รายเดือน)</h2>
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <canvas id="electricChart"></canvas>
            </div>
        </div>

        <!-- ประวัติการบันทึกแบบกลุ่มรายเดือน -->
        <div class="mt-8">
            <h2 class="text-lg font-bold text-slate-800 mb-3">📜 สรุปยอดตามรอบบิล</h2>
            <div id="logList" class="space-y-3 max-h-96 overflow-y-auto">
                <!-- ข้อมูลจะถูกจัดกลุ่มและแสดงตรงนี้ -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kurgundntxdbomtsuzpc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cmd1bmRudHhkYm9tdHN1enBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNTE0MzIsImV4cCI6MjEwODcyNzQzMn0.zBPUIl_vZ37BoBaxbIvcKZdvGwEyEtTonhyXhoSrfSA';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('recordDate').valueAsDate = new Date();

        const form = document.getElementById('electricForm');
        const logList = document.getElementById('logList');
        const meterUnitInput = document.getElementById('meterUnit');
        const unitRateInput = document.getElementById('unitRate');
        const editIdInput = document.getElementById('editId');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        
        let electricChart = null;

        function getBillingCycle(dateString) {
            const date = new Date(dateString);
            let day = date.getDate();
            let month = date.getMonth(); 
            let year = date.getFullYear();

            if (day > 25) {
                month += 1;
                if (month > 11) {
                    month = 0;
                    year += 1;
                }
            }
            const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return {
                key: `${year}-${String(month + 1).padStart(2, '0')}`,
                text: `${monthNames[month]} ${year + 543}`
            };
        }

        function renderChart(chartLabels, chartData) {
            const ctx = document.getElementById('electricChart').getContext('2d');
            if (electricChart) electricChart.destroy();

            electricChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'หน่วยที่ใช้ (Unit)',
                        data: chartData,
                        backgroundColor: 'rgba(37, 99, 235, 0.6)',
                        borderColor: 'rgb(37, 99, 235)',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        async function fetchLogs() {
            const { data, error } = await _supabase
                .from('electricity_logs')
                .select('*')
                .order('recorded_date', { ascending: true });

            if (error) {
                console.error('Error fetching:', error);
                return;
            }

            if (data && data.length > 0 && !editIdInput.value) {
                meterUnitInput.placeholder = `ครั้งล่าสุด: ${data[data.length - 1].meter_unit}`;
                if (data[data.length - 1].unit_rate) {
                    unitRateInput.value = data[data.length - 1].unit_rate;
                }
            } else if (!editIdInput.value) {
                meterUnitInput.placeholder = 'เช่น 15420';
            }

            logList.innerHTML = '';
            if (data.length === 0) {
                logList.innerHTML = '<p class="text-slate-400 text-center text-sm">ยังไม่มีข้อมูลการบันทึก</p>';
                renderChart([], []);
                return;
            }

            const grouped = {};
            data.forEach(log => {
                const cycle = getBillingCycle(log.recorded_date);
                if (!grouped[cycle.key]) {
                    grouped[cycle.key] = {
                        title: `รอบบิล ${cycle.text}`,
                        shortTitle: cycle.text,
                        totalUnit: 0,
                        totalPrice: 0,
                        logs: []
                    };
                }
                grouped[cycle.key].logs.push(log);
                grouped[cycle.key].totalUnit += (log.unit_used || 0);
                grouped[cycle.key].totalPrice += (log.total_price || 0);
            });

            const sortedKeys = Object.keys(grouped).sort();
            const chartLabels = [];
            const chartData = [];

            sortedKeys.forEach(key => {
                chartLabels.push(grouped[key].shortTitle);
                chartData.push(grouped[key].totalUnit);
            });

            renderChart(chartLabels, chartData);

            sortedKeys.reverse().forEach(key => {
                const group = grouped[key];
                let innerLogsHtml = '';
                
                group.logs.forEach(item => {
                    innerLogsHtml += `
                        <div class="flex justify-between items-center text-xs text-slate-600 bg-white p-2.5 rounded border border-slate-100 gap-2">
                            <div>
                                <span class="font-semibold text-slate-700">📅 ${item.recorded_date}</span>
                                <span class="text-slate-500 block">มิเตอร์: ${item.meter_unit} | ใช้: ${item.unit_used || 0} หน่วย (฿${(item.total_price || 0).toFixed(2)})</span>
                            </div>
                            <div class="flex gap-1 shrink-0">
                                <button onclick="editLog(${item.id}, '${item.recorded_date}', ${item.meter_unit}, ${item.unit_rate || 4.5})" class="bg-amber-100 text-amber-700 px-2 py-1 rounded hover:bg-amber-200 transition">แก้ไข</button>
                                <button onclick="deleteLog(${item.id})" class="bg-rose-100 text-rose-700 px-2 py-1 rounded hover:bg-rose-200 transition">ลบ</button>
                            </div>
                        </div>
                    `;
                });

                logList.innerHTML += `
                    <details class="group bg-slate-50 rounded-xl border border-slate-200 overflow-hidden transition" open>
                        <summary class="p-4 cursor-pointer select-none flex justify-between items-center hover:bg-slate-100">
                            <div>
                                <p class="text-sm font-bold text-slate-700">📌 ${group.title}</p>
                                <p class="text-xs text-slate-500">รวมใช้: <span class="text-blue-600 font-semibold">${group.totalUnit} หน่วย</span></p>
                            </div>
                            <div class="text-right flex items-center gap-2">
                                <div>
                                    <p class="text-sm font-bold text-emerald-600">฿${group.totalPrice.toFixed(2)}</p>
                                </div>
                                <span class="text-slate-400 transform group-open:rotate-180 transition">▼</span>
                            </div>
                        </summary>
                        <div class="p-3 bg-slate-100/60 border-t border-slate-200 space-y-2">
                            <p class="text-xs font-semibold text-slate-400 mb-1">ประวัติการจดในรอบนี้:</p>
                            ${innerLogsHtml}
                        </div>
                    </details>
                `;
            });
        }

        // ฟังก์ชันเตรียมข้อมูลใส่ฟอร์มเพื่อแก้ไข
        window.editLog = function(id, date, meter, rate) {
            editIdInput.value = id;
            document.getElementById('recordDate').value = date;
            meterUnitInput.value = meter;
            unitRateInput.value = rate;
            
            submitBtn.textContent = 'อัปเดตข้อมูล';
            submitBtn.className = 'flex-1 bg-amber-600 text-white py-2 rounded-lg font-semibold hover:bg-amber-700 transition';
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ฟังก์ชันล้างฟอร์มกลับเป็นโหมดปกติ
        window.resetForm = function() {
            editIdInput.value = '';
            form.reset();
            document.getElementById('recordDate').valueAsDate = new Date();
            submitBtn.textContent = 'บันทึกข้อมูล';
            submitBtn.className = 'flex-1 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition';
            cancelEditBtn.classList.add('hidden');
            fetchLogs();
        }

        // ฟังก์ชันลบข้อมูล
        window.deleteLog = async function(id) {
            if (!confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) return;

            const { error } = await _supabase
                .from('electricity_logs')
                .delete()
                .eq('id', id);

            if (error) {
                alert('เกิดข้อผิดพลาดในการลบ: ' + error.message);
            } else {
                alert('ลบข้อมูลเรียบร้อยแล้ว');
                fetchLogs();
            }
        }

        // ฟังก์ชันกดบันทึกหรืออัปเดตข้อมูล
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = editIdInput.value;
            const recorded_date = document.getElementById('recordDate').value;
            const meter_unit = parseFloat(meterUnitInput.value);
            const unitRate = parseFloat(unitRateInput.value);

            // ดึงข้อมูลทั้งหมดมาคำนวณหน่วยที่ใช้ใหม่ตามลำดับเวลา
            const { data: allData } = await _supabase
                .from('electricity_logs')
                .select('*')
                .order('recorded_date', { ascending: true });

            if (editId) {
                // โหมดแก้ไข: คำนวณหน่วยที่ใช้ใหม่เทียบกับแถวก่อนหน้าของรายการที่จะแก้
                const index = allData.findIndex(item => item.id == editId);
                let unit_used = 0;
                if (index > 0) {
                    unit_used = meter_unit - allData[index - 1].meter_unit;
                } else {
                    unit_used = 0; // ถ้าเป็นรายการแรกสุด
                }
                if (unit_used < 0) unit_used = 0;
                const total_price = unit_used * unitRate;

                const { error } = await _supabase
                    .from('electricity_logs')
                    .update({ recorded_date, meter_unit, unit_used, total_price, unit_rate: unitRate })
                    .eq('id', editId);

                if (error) {
                    alert('เกิดข้อผิดพลาดในการอัปเดต: ' + error.message);
                } else {
                    alert('อัปเดตข้อมูลสำเร็จ!');
                    resetForm();
                }
            } else {
                // โหมดเพิ่มใหม่
                const lastItem = allData && allData.length > 0 ? allData[allData.length - 1] : null;
                let unit_used = 0;
                if (lastItem) {
                    unit_used = meter_unit - lastItem.meter_unit;
                    if (unit_used < 0) unit_used = 0;
                }
                const total_price = unit_used * unitRate;

                const { error } = await _supabase.from('electricity_logs').insert([
                    { recorded_date, meter_unit, unit_used, total_price, unit_rate: unitRate }
                ]);

                if (error) {
                    alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
                } else {
                    alert('บันทึกสำเร็จ!');
                    form.reset();
                    document.getElementById('recordDate').valueAsDate = new Date();
                    fetchLogs();
                }
            }
        });

        fetchLogs();
    </script>
</body>
</html>
